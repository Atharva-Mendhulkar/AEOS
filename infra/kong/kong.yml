_format_version: "3.0"

services:
  - name: api-gateway
    url: http://api-gateway:8000
    routes:
      - name: api-routes
        paths:
          - /api/v1/
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          second: 100
          policy: local

  - name: observability-service
    url: http://observability-service:8040
    routes:
      - name: websocket-routes
        paths:
          - /ws/
        strip_path: false

  - name: frontend
    url: http://frontend:3000
    routes:
      - name: frontend-routes
        paths:
          - /
        strip_path: false

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
      exposed_headers:
        - Authorization
      credentials: true
      max_age: 3600
