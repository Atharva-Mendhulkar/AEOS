{{- if .Values.kafka.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aeos-zookeeper
  labels:
    app: aeos-zookeeper
    part-of: aeos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aeos-zookeeper
  template:
    metadata:
      labels:
        app: aeos-zookeeper
    spec:
      containers:
        - name: zookeeper
          image: {{ .Values.kafka.zookeeperImage }}
          ports:
            - containerPort: 2181
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
---
apiVersion: v1
kind: Service
metadata:
  name: aeos-zookeeper
  labels:
    app: aeos-zookeeper
    part-of: aeos
spec:
  ports:
    - port: 2181
  selector:
    app: aeos-zookeeper
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aeos-kafka
  labels:
    app: aeos-kafka
    part-of: aeos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aeos-kafka
  template:
    metadata:
      labels:
        app: aeos-kafka
    spec:
      containers:
        - name: kafka
          image: {{ .Values.kafka.image }}
          ports:
            - containerPort: {{ .Values.kafka.port }}
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "aeos-zookeeper:2181"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://aeos-kafka:29092,PLAINTEXT_HOST://localhost:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: aeos-kafka
  labels:
    app: aeos-kafka
    part-of: aeos
spec:
  ports:
    - port: {{ .Values.kafka.port }}
      name: internal
    - port: 9092
      name: external
  selector:
    app: aeos-kafka
{{- end }}
