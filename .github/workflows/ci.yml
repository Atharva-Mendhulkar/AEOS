name: AEOS CI/CD Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./shared/python
          for req in services/*/requirements.txt; do pip install -r "$req"; done
          pip install pytest pytest-asyncio httpx

      - name: Run shared backend/property tests
        run: python -m pytest shared/python/tests/

  test-coordinator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/coordinator/package-lock.json

      - name: Install coordinator dependencies
        working-directory: services/coordinator
        run: npm ci

      - name: Build coordinator
        working-directory: services/coordinator
        run: npm run build

      - name: Test coordinator
        working-directory: services/coordinator
        run: npm test -- --runInBand

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test -- --runInBand

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: frontend
        run: npm run test:e2e

  test-e2e:
    needs: [test-backend, test-coordinator, test-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Create CI environment
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=aeos
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          DATABASE_URL=postgresql://postgres:postgres@postgres:5432/aeos
          REDIS_PASSWORD=aeosredis
          REDIS_URL=redis://:aeosredis@redis:6379/0
          CELERY_BROKER_URL=redis://:aeosredis@redis:6379/0
          CELERY_RESULT_BACKEND=redis://:aeosredis@redis:6379/0
          JWT_SECRET=test-jwt-secret-key-for-aeos-123456789
          JWT_EXPIRY_SECONDS=3600
          GEMINI_API_KEY=mock-key
          FEATHERLESS_API_KEY=mock-key
          GEMINI_MODEL_PLANNER=gemini-1.5-pro
          GEMINI_MODEL_ANALYSIS=gemini-1.5-pro
          GEMINI_MODEL_OPERATIONS=gemini-1.5-flash
          GEMINI_MODEL_VALIDATION=gemini-1.5-flash
          GEMINI_MODEL_GOVERNANCE=gemini-1.5-flash
          FEATHERLESS_MODEL_COMPLIANCE=mock
          SPEECHMATICS_API_KEY=mock-key
          SPEECHMATICS_API_URL=https://asr.api.speechmatics.com/v2
          NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
          NEXT_PUBLIC_WS_URL=ws://localhost:8040
          RISK_THRESHOLD_HIGH=7.0
          RISK_THRESHOLD_CRITICAL=9.0
          POLICY_RELOAD_TIMEOUT_SECONDS=10
          ANOMALY_BASELINE_WINDOW=1000
          CONFIDENCE_THRESHOLD=0.7
          ESCALATION_TIMEOUT_SECONDS=3
          ESCALATION_TIER2_TIMEOUT_SECONDS=6
          STEP_EXECUTION_TIMEOUT_SECONDS=120
          MEMORY_CONTEXT_QUERY_TIMEOUT_MS=500
          EVENT_BUFFER_SIZE=1000
          AUDIT_RETENTION_DAYS=90
          AEOS_RETENTION_DAYS=90
          EOF

      - name: Start Docker Compose environment
        run: docker compose -f docker-compose.yml up -d --build

      - name: Wait for API Gateway
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8000/health | grep -q api-gateway; then
              exit 0
            fi
            sleep 3
          done
          docker compose logs
          exit 1

      - name: Set up Python for E2E
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run E2E Tests
        env:
          AEOS_E2E_API_BASE: http://localhost:8000/api/v1
          JWT_SECRET: test-jwt-secret-key-for-aeos-123456789
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx python-jose[cryptography]
          python -m pytest tests/e2e/

      - name: Tear down Docker Compose environment
        if: always()
        run: docker compose -f docker-compose.yml down -v
