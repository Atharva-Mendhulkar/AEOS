networks:
  aeos-network:
    driver: bridge
volumes:
  postgres-data: null
  redis-data: null
services:
  kong:
    image: kong:3.6.1-ubuntu
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/usr/local/kong/declarative/kong.yml
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_ADMIN_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_LISTEN=0.0.0.0:8001, 0.0.0.0:8444 ssl
    ports:
      - 80:8000
      - 443:8443
    volumes:
      - ./infra/kong/kong.yml:/usr/local/kong/declarative/kong.yml:ro
    depends_on:
      - frontend
      - api-gateway
      - observability-service
    networks:
      - aeos-network
    restart: unless-stopped
  envoy:
    image: envoyproxy/envoy:v1.30-latest
    ports:
      - 10000:10000
    volumes:
      - ./infra/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    networks:
      - aeos-network
    restart: unless-stopped
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aeos}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      AEOS_JWT_SECRET: ${AEOS_JWT_SECRET:-${JWT_SECRET:-test-jwt-secret-key-for-aeos-123456789}}
    volumes:
    - postgres-data:/var/lib/postgresql/data
    - ./infra/db/migrations:/docker-entrypoint-initdb.d:ro
    networks:
    - aeos-network
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aeos}
      interval: 10s
      timeout: 5s
      retries: 5
  postgres-replica:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aeos}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    networks:
      - aeos-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
  redis:
    image: redis:7.2-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-aeosredis} --appendonly yes
    volumes:
    - redis-data:/data
    networks:
    - aeos-network
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - redis-cli
      - -a
      - ${REDIS_PASSWORD:-aeosredis}
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - aeos-network
    restart: unless-stopped
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - 9092:9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - aeos-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 10s
      timeout: 5s
      retries: 5
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8040}
      AEOS_JWT_SECRET: ${AEOS_JWT_SECRET:-${JWT_SECRET:-test-jwt-secret-key-for-aeos-123456789}}
    depends_on:
    - api-gateway
    networks:
    - aeos-network
    restart: unless-stopped
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/aeos}
      REDIS_URL: ${REDIS_URL:-redis://:aeosredis@redis:6379/0}
      KAFKA_URL: ${KAFKA_URL:-kafka:29092}
      JWT_SECRET: ${JWT_SECRET:-test-jwt-secret-key-for-aeos-123456789}
      COORDINATOR_URL: http://coordinator:8001
      MEMORY_AGENT_URL: http://memory-agent:8017
      OBSERVABILITY_URL: http://observability-service:8040
      AEOS_JWT_SECRET: ${AEOS_JWT_SECRET:-${JWT_SECRET:-test-jwt-secret-key-for-aeos-123456789}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
    - aeos-network
    restart: unless-stopped
    volumes:
    - ./shared/python/aeos_shared:/app/aeos_shared
    ports:
    - 8000:8000
  coordinator:
    build:
      context: ./services/coordinator
      dockerfile: Dockerfile
    environment:
      PORT: '8001'
      REDIS_URL: ${REDIS_URL:-redis://:aeosredis@redis:6379/0}
      KAFKA_URL: ${KAFKA_URL:-kafka:29092}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/aeos}
      PLANNER_URL: http://planner-agent:8010
      OBSERVABILITY_URL: http://observability-service:8040
      MEMORY_AGENT_URL: http://memory-agent:8017
      ESCALATION_URL: http://escalation-agent:8016
      AEOS_JWT_SECRET: ${AEOS_JWT_SECRET:-${JWT_SECRET:-test-jwt-secret-key-for-aeos-123456789}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
    - aeos-network
    restart: unless-stopped
    volumes:
    - ./shared/python/aeos_shared:/app/aeos_shared
  planner-agent:
    build:
      context: ./services/planner-agent
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/aeos}
      REDIS_URL: ${REDIS_URL:-redis://:aeosredis@redis:6379/0}
      KAFKA_URL: ${KAFKA_URL:-kafka:29092}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-mock-key}
      GEMINI_MODEL_PLANNER: ${GEMINI_MODEL_PLANNER:-gemini-2.5-pro}
      COORDINATOR_URL: http://coordinator:8001
      GOVERNANCE_URL: http://governance-service:8020
      MEMORY_AGENT_URL: http://memory-agent:8017
      ESCALATION_URL: http://escalation-agent:8016
      ESCALATION_AGENT_URL: http://escalation-agent:8016
      AEOS_JWT_SECRET: ${AEOS_JWT_SECRET:-${JWT_SECRET:-test-jwt-secret-key-for-aeos-123456789}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
    - aeos-network
    restart: unless-stopped
    volumes:
    - ./shared/python/aeos_shared:/app/aeos_shared
  incident-analysis-agent:
    build:
      context: ./services/incident-analysis-agent
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/aeos}
      REDIS_URL: ${REDIS_URL:-redis://:aeosredis@redis:6379/0}
      KAFKA_URL: ${KAFKA_URL:-kafka:29092}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-mock-key}
      GEMINI_MODEL_ANALYSIS: ${GEMINI_MODEL_ANALYSIS:-gemini-2.5-pro}
      COORDINATOR_URL: http://coordinator:8001
      MEMORY_AGENT_URL: http://memory-agent:8017
      ESCALATION_URL: http://escalation-agent:8016
      ESCALATION_AGENT_URL: http://escalation-agent:8016
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.6}
      AEOS_JWT_SECRET: ${AEOS_JWT_SECRET:-${JWT_SECRET:-test-jwt-secret-key-for-aeos-123456789}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
    - aeos-network
    restart: unless-stopped
    volumes:
    - ./shared/python/aeos_shared:/app/aeos_shared
  operations-agent:
    build:
      context: ./services/operations-agent
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/aeos}
      REDIS_URL: ${REDIS_URL:-redis://:aeosredis@redis:6379/0}
      KAFKA_URL: ${KAFKA_URL:-kafka:29092}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-mock-key}
      GEMINI_MODEL_OPERATIONS: ${GEMINI_MODEL_OPERATIONS:-gemini-2.5-pro}
      COORDINATOR_URL: http://coordinator:8001
      GOVERNANCE_URL: http://governance-service:8020
      MEMORY_AGENT_URL: http://memory-agent:8017
      AEOS_JWT_SECRET: ${AEOS_JWT_SECRET:-${JWT_SECRET:-test-jwt-secret-key-for-aeos-123456789}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
    - aeos-network
    restart: unless-stopped
    volumes:
    - ./shared/python/aeos_shared:/app/aeos_shared
  compliance-agent:
    build:
      context: ./services/compliance-agent
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/aeos}
      REDIS_URL: ${REDIS_URL:-redis://:aeosredis@redis:6379/0}
      KAFKA_URL: ${KAFKA_URL:-kafka:29092}
      FEATHERLESS_API_KEY: ${FEATHERLESS_API_KEY:-mock-key}
      FEATHERLESS_MODEL_COMPLIANCE: ${FEATHERLESS_MODEL_COMPLIANCE:-meta-llama/Llama-3-70b-chat-hf}
      COORDINATOR_URL: http://coordinator:8001
      GOVERNANCE_URL: http://governance-service:8020
      MEMORY_AGENT_URL: http://memory-agent:8017
      AEOS_JWT_SECRET: ${AEOS_JWT_SECRET:-${JWT_SECRET:-test-jwt-secret-key-for-aeos-123456789}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
    - aeos-network
    restart: unless-stopped
    volumes:
    - ./shared/python/aeos_shared:/app/aeos_shared
  validation-agent:
    build:
      context: ./services/validation-agent
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/aeos}
      REDIS_URL: ${REDIS_URL:-redis://:aeosredis@redis:6379/0}
      KAFKA_URL: ${KAFKA_URL:-kafka:29092}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-mock-key}
      GEMINI_MODEL_VALIDATION: ${GEMINI_MODEL_VALIDATION:-gemini-2.5-pro}
      COORDINATOR_URL: http://coordinator:8001
      GOVERNANCE_URL: http://governance-service:8020
      MEMORY_AGENT_URL: http://memory-agent:8017
      AEOS_JWT_SECRET: ${AEOS_JWT_SECRET:-${JWT_SECRET:-test-jwt-secret-key-for-aeos-123456789}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
    - aeos-network
    restart: unless-stopped
    volumes:
    - ./shared/python/aeos_shared:/app/aeos_shared
  recovery-agent:
    build:
      context: ./services/recovery-agent
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/aeos}
      REDIS_URL: ${REDIS_URL:-redis://:aeosredis@redis:6379/0}
      KAFKA_URL: ${KAFKA_URL:-kafka:29092}
      COORDINATOR_URL: http://coordinator:8001
      PLANNER_URL: http://planner-agent:8010
      ESCALATION_URL: http://escalation-agent:8016
      MEMORY_AGENT_URL: http://memory-agent:8017
      OBSERVABILITY_URL: http://observability-service:8040
      AEOS_JWT_SECRET: ${AEOS_JWT_SECRET:-${JWT_SECRET:-test-jwt-secret-key-for-aeos-123456789}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
    - aeos-network
    restart: unless-stopped
    volumes:
    - ./shared/python/aeos_shared:/app/aeos_shared
  escalation-agent:
    build:
      context: ./services/escalation-agent
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/aeos}
      REDIS_URL: ${REDIS_URL:-redis://:aeosredis@redis:6379/0}
      KAFKA_URL: ${KAFKA_URL:-kafka:29092}
      COORDINATOR_URL: http://coordinator:8001
      WORKFLOW_ENGINE_URL: http://workflow-engine:8030
      RECOVERY_URL: http://recovery-agent:8015
      RECOVERY_AGENT_URL: http://recovery-agent:8015
      MEMORY_AGENT_URL: http://memory-agent:8017
      OBSERVABILITY_URL: http://observability-service:8040
      ESCALATION_TIMEOUT_SECONDS: ${ESCALATION_TIMEOUT_SECONDS:-3600}
      ESCALATION_TIER2_TIMEOUT_SECONDS: ${ESCALATION_TIER2_TIMEOUT_SECONDS:-86400}
      AEOS_JWT_SECRET: ${AEOS_JWT_SECRET:-${JWT_SECRET:-test-jwt-secret-key-for-aeos-123456789}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
    - aeos-network
    restart: unless-stopped
    volumes:
    - ./shared/python/aeos_shared:/app/aeos_shared
  memory-agent:
    build:
      context: ./services/memory-agent
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/aeos}
      REDIS_URL: ${REDIS_URL:-redis://:aeosredis@redis:6379/0}
      KAFKA_URL: ${KAFKA_URL:-kafka:29092}
      MEMORY_CONTEXT_QUERY_TIMEOUT_MS: ${MEMORY_CONTEXT_QUERY_TIMEOUT_MS:-5000}
      AEOS_JWT_SECRET: ${AEOS_JWT_SECRET:-${JWT_SECRET:-test-jwt-secret-key-for-aeos-123456789}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
    - aeos-network
    restart: unless-stopped
    volumes:
    - ./shared/python/aeos_shared:/app/aeos_shared
  memory-retention-worker:
    build:
      context: ./services/memory-agent
      dockerfile: Dockerfile
    command: celery -A memory_jobs.retention.celery_app worker -B --loglevel=info
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/aeos}
      REDIS_URL: ${REDIS_URL:-redis://:aeosredis@redis:6379/0}
      KAFKA_URL: ${KAFKA_URL:-kafka:29092}
      AEOS_RETENTION_DAYS: ${AEOS_RETENTION_DAYS:-90}
      AEOS_JWT_SECRET: ${AEOS_JWT_SECRET:-${JWT_SECRET:-test-jwt-secret-key-for-aeos-123456789}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
    - aeos-network
    restart: unless-stopped
    volumes:
    - ./shared/python/aeos_shared:/app/aeos_shared
  governance-service:
    build:
      context: ./services/governance-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/aeos}
      REDIS_URL: ${REDIS_URL:-redis://:aeosredis@redis:6379/0}
      KAFKA_URL: ${KAFKA_URL:-kafka:29092}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-mock-key}
      GEMINI_MODEL_GOVERNANCE: ${GEMINI_MODEL_GOVERNANCE:-gemini-2.5-pro}
      ESCALATION_URL: http://escalation-agent:8016
      ESCALATION_AGENT_URL: http://escalation-agent:8016
      MEMORY_AGENT_URL: http://memory-agent:8017
      OBSERVABILITY_URL: http://observability-service:8040
      RISK_THRESHOLD_HIGH: ${RISK_THRESHOLD_HIGH:-7.0}
      RISK_THRESHOLD_CRITICAL: ${RISK_THRESHOLD_CRITICAL:-9.0}
      POLICY_RELOAD_TIMEOUT_SECONDS: ${POLICY_RELOAD_TIMEOUT_SECONDS:-30}
      ANOMALY_BASELINE_WINDOW: ${ANOMALY_BASELINE_WINDOW:-10}
      AEOS_JWT_SECRET: ${AEOS_JWT_SECRET:-${JWT_SECRET:-test-jwt-secret-key-for-aeos-123456789}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
    - aeos-network
    restart: unless-stopped
    volumes:
    - ./shared/python/aeos_shared:/app/aeos_shared
  workflow-engine:
    build:
      context: ./services/workflow-engine
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/aeos}
      REDIS_URL: ${REDIS_URL:-redis://:aeosredis@redis:6379/0}
      KAFKA_URL: ${KAFKA_URL:-kafka:29092}
      GOVERNANCE_URL: http://governance-service:8020
      COORDINATOR_URL: http://coordinator:8001
      RECOVERY_URL: http://recovery-agent:8015
      RECOVERY_AGENT_URL: http://recovery-agent:8015
      ESCALATION_AGENT_URL: http://escalation-agent:8016
      MEMORY_AGENT_URL: http://memory-agent:8017
      OBSERVABILITY_URL: http://observability-service:8040
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://:aeosredis@redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://:aeosredis@redis:6379/0}
      CELERY_ALWAYS_EAGER: "true"
      STEP_EXECUTION_TIMEOUT_SECONDS: ${STEP_EXECUTION_TIMEOUT_SECONDS:-300}
      AEOS_JWT_SECRET: ${AEOS_JWT_SECRET:-${JWT_SECRET:-test-jwt-secret-key-for-aeos-123456789}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
    - aeos-network
    restart: unless-stopped
    volumes:
    - ./shared/python/aeos_shared:/app/aeos_shared
  observability-service:
    build:
      context: ./services/observability-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/aeos}
      REDIS_URL: ${REDIS_URL:-redis://:aeosredis@redis:6379/0}
      KAFKA_URL: ${KAFKA_URL:-kafka:29092}
      JWT_SECRET: ${JWT_SECRET:-test-jwt-secret-key-for-aeos-123456789}
      MEMORY_AGENT_URL: http://memory-agent:8017
      EVENT_BUFFER_SIZE: ${EVENT_BUFFER_SIZE:-1000}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90}
      AEOS_JWT_SECRET: ${AEOS_JWT_SECRET:-${JWT_SECRET:-test-jwt-secret-key-for-aeos-123456789}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
    - aeos-network
    restart: unless-stopped
    volumes:
    - ./shared/python/aeos_shared:/app/aeos_shared
    ports:
    - 8040:8040

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infra/telemetry/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - 9090:9090
    networks:
      - aeos-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - 3000:3000
    networks:
      - aeos-network
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    ports:
      - 3100:3100
    networks:
      - aeos-network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    volumes:
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./infra/telemetry/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - aeos-network
    restart: unless-stopped
