version: '3.9'
networks:
  aeos-network:
    driver: bridge
volumes:
  postgres-data: null
  redis-data: null
services:
  nginx:
    build:
      context: ./infra/nginx
      dockerfile: Dockerfile
    ports:
    - 80:80
    - 443:443
    volumes:
    - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
    - frontend
    - api-gateway
    - observability-service
    networks:
    - aeos-network
    restart: unless-stopped
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AEOS_JWT_SECRET: ${AEOS_JWT_SECRET:-${JWT_SECRET}}
    volumes:
    - postgres-data:/var/lib/postgresql/data
    - ./infra/db/migrations:/docker-entrypoint-initdb.d:ro
    networks:
    - aeos-network
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7.2-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
    - redis-data:/data
    networks:
    - aeos-network
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - redis-cli
      - -a
      - ${REDIS_PASSWORD}
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
      AEOS_JWT_SECRET: ${AEOS_JWT_SECRET:-${JWT_SECRET}}
    depends_on:
    - api-gateway
    networks:
    - aeos-network
    restart: unless-stopped
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      COORDINATOR_URL: http://coordinator:8001
      MEMORY_AGENT_URL: http://memory-agent:8017
      OBSERVABILITY_URL: http://observability-service:8040
      AEOS_JWT_SECRET: ${AEOS_JWT_SECRET:-${JWT_SECRET}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
    - aeos-network
    restart: unless-stopped
    volumes:
    - ./shared/python/aeos_shared:/app/aeos_shared
    ports:
    - 8000:8000
  coordinator:
    build:
      context: ./services/coordinator
      dockerfile: Dockerfile
    environment:
      PORT: '8001'
      REDIS_URL: ${REDIS_URL}
      DATABASE_URL: ${DATABASE_URL}
      PLANNER_URL: http://planner-agent:8010
      OBSERVABILITY_URL: http://observability-service:8040
      MEMORY_AGENT_URL: http://memory-agent:8017
      ESCALATION_URL: http://escalation-agent:8016
      AEOS_JWT_SECRET: ${AEOS_JWT_SECRET:-${JWT_SECRET}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
    - aeos-network
    restart: unless-stopped
    volumes:
    - ./shared/python/aeos_shared:/app/aeos_shared
  planner-agent:
    build:
      context: ./services/planner-agent
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL_PLANNER: ${GEMINI_MODEL_PLANNER}
      COORDINATOR_URL: http://coordinator:8001
      GOVERNANCE_URL: http://governance-service:8020
      MEMORY_AGENT_URL: http://memory-agent:8017
      ESCALATION_URL: http://escalation-agent:8016
      AEOS_JWT_SECRET: ${AEOS_JWT_SECRET:-${JWT_SECRET}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
